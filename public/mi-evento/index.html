<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mi Evento</title>
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#C4602B" />
  <link rel="icon" type="image/png" href="/icon-192.png" />
  <link rel="apple-touch-icon" href="/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" />
  <style>
    :root {
      --bg: #F6F2EC;
      --surface: #FFFFFF;
      --surface-warm: #FBF7F1;
      --text: #1C1917;
      --text-sub: #57534E;
      --text-muted: #A8A29E;
      --accent: #C4602B;
      --accent-hover: #B5551F;
      --green: #3D7A4A;
      --green-bg: #EBF5ED;
      --green-border: rgba(61,122,74,0.2);
      --gold: #A68A3E;
      --gold-bg: #FAF5E8;
      --gold-border: rgba(166,138,62,0.2);
      --red: #DC2626;
      --red-bg: #FEF2F2;
      --border: #E7E0D6;
      --border-light: #F0EBE3;
      --shadow-sm: 0 1px 3px rgba(28,14,8,0.06);
      --shadow-md: 0 4px 16px rgba(28,14,8,0.08);
      --radius: 14px;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #171310; --surface: #211C17; --surface-warm: #281F18;
        --text: #EDE8E1; --text-sub: #B5AA9A; --text-muted: #6D6560;
        --accent: #E07A42; --accent-hover: #D06A32;
        --green: #5FAA6E; --green-bg: #1A2B1E; --green-border: rgba(95,170,110,0.2);
        --gold: #CCA84E; --gold-bg: #262015; --gold-border: rgba(204,168,78,0.2);
        --red: #F87171; --red-bg: #2A1515;
        --border: #332C24; --border-light: #2A241D;
        --shadow-sm: 0 1px 3px rgba(0,0,0,0.15); --shadow-md: 0 4px 16px rgba(0,0,0,0.2);
      }
    }
    :root[data-theme="dark"] {
      --bg: #171310; --surface: #211C17; --surface-warm: #281F18;
      --text: #EDE8E1; --text-sub: #B5AA9A; --text-muted: #6D6560;
      --accent: #E07A42; --accent-hover: #D06A32;
      --green: #5FAA6E; --green-bg: #1A2B1E; --green-border: rgba(95,170,110,0.2);
      --gold: #CCA84E; --gold-bg: #262015; --gold-border: rgba(204,168,78,0.2);
      --red: #F87171; --red-bg: #2A1515;
      --border: #332C24; --border-light: #2A241D;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.15); --shadow-md: 0 4px 16px rgba(0,0,0,0.2);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'DM Sans', system-ui, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

    .loading { display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 80vh; gap: 16px; }
    .loading-spinner { width: 32px; height: 32px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { font-size: 13px; color: var(--text-muted); }

    .error-page { text-align: center; padding: 80px 24px; }
    .error-page h2 { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; margin-bottom: 8px; }
    .error-page p { font-size: 14px; color: var(--text-sub); line-height: 1.5; }

    /* ── HEADER ── */
    .header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 16px 20px; position: sticky; top: 0; z-index: 20; }
    .header-inner { max-width: 520px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
    .header-logo { width: 40px; height: 40px; border-radius: 10px; object-fit: cover; flex-shrink: 0; }
    .header-info { flex: 1; min-width: 0; }
    .header-biz { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; }
    .header-event { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* ── TABS ── */
    .tabs { background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 73px; z-index: 19; }
    .tabs-inner { max-width: 520px; margin: 0 auto; display: flex; }
    .tab { flex: 1; padding: 12px 8px; text-align: center; font-size: 13px; font-weight: 600; color: var(--text-muted); cursor: pointer; border: none; background: none; border-bottom: 2px solid transparent; transition: color 0.2s, border-color 0.2s; font-family: inherit; }
    .tab:hover { color: var(--text-sub); }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-ico { font-size: 16px; display: block; margin-bottom: 2px; }

    /* ── CONTENT ── */
    .content { max-width: 520px; margin: 0 auto; padding: 20px 16px 100px; }

    /* ── CARDS ── */
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; box-shadow: var(--shadow-sm); }
    .card-title { font-family: 'Playfair Display', Georgia, serif; font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .card-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; }
    .card-row:last-child { border-bottom: none; }
    .card-row-label { color: var(--text-sub); }
    .card-row-value { font-weight: 600; }

    /* ── PAYMENT ── */
    .pay-bar { height: 8px; background: var(--border-light); border-radius: 4px; margin: 12px 0 8px; overflow: hidden; }
    .pay-bar-fill { height: 100%; background: var(--green); border-radius: 4px; transition: width 0.6s ease; }
    .pay-summary { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
    .pay-box { text-align: center; padding: 10px 8px; background: var(--surface-warm); border-radius: 10px; }
    .pay-box-label { font-size: 10px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.3px; margin-bottom: 2px; }
    .pay-box-value { font-family: 'Playfair Display', Georgia, serif; font-size: 17px; font-weight: 700; }
    .pay-box-value.saldo { color: var(--red); }
    .pay-box-value.pagado { color: var(--green); }
    .pay-detail { margin-top: 12px; }
    .pay-item { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; font-size: 12px; color: var(--text-sub); }
    .pay-item-badge { font-size: 10px; padding: 2px 8px; background: var(--green-bg); color: var(--green); border-radius: 99px; font-weight: 600; border: 1px solid var(--green-border); }

    /* ── CONDITIONS ── */
    .conditions { background: var(--surface-warm); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .conditions-title { font-family: 'Playfair Display', Georgia, serif; font-size: 16px; font-weight: 700; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .rule-row { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border-light); font-size: 13px; color: var(--text-sub); line-height: 1.4; }
    .rule-row:last-child { border-bottom: none; }
    .conditions-text { font-size: 13px; color: var(--text-sub); line-height: 1.6; white-space: pre-line; }

    /* ── SHARE CONFIG (Mi Evento tab) ── */
    .section-label { font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; }
    .toggle-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border-light); cursor: pointer; }
    .toggle-row input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
    .toggle-ico { font-size: 15px; }
    .toggle-label { font-size: 13px; font-weight: 600; flex: 1; }
    .fixed-note { font-size: 12px; color: var(--text-muted); margin-top: 8px; padding: 8px 0; }

    .input { width: 100%; padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--border); font-size: 13px; font-family: inherit; background: var(--surface); color: var(--text); box-sizing: border-box; }
    .input:focus { outline: none; border-color: var(--accent); }
    .textarea { resize: vertical; min-height: 60px; }
    .char-count { text-align: right; font-size: 11px; color: var(--text-muted); margin-top: 2px; }

    .themes { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
    .theme-btn { width: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: none; cursor: pointer; padding: 0; }
    .theme-btn:hover .theme-swatch { transform: scale(1.08); }
    .theme-swatch { width: 42px; height: 42px; border-radius: 10px; border: 2px solid var(--border); position: relative; transition: transform 0.15s; }
    .theme-btn.active .theme-swatch { border-color: var(--accent); border-width: 3px; }
    .theme-check { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 14px; font-weight: 800; }
    .theme-name { font-size: 10px; color: var(--text-muted); font-weight: 600; }
    .theme-check { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #FFF; font-size: 14px; font-weight: 800; }

    .hero-upload { display: flex; align-items: center; gap: 10px; padding: 12px 14px; background: var(--surface); border: 1.5px dashed var(--border); border-radius: 10px; cursor: pointer; margin-bottom: 16px; }
    .hero-upload-ico { font-size: 20px; }
    .hero-upload-text { font-size: 13px; font-weight: 600; }
    .hero-upload-sub { font-size: 11px; color: var(--text-muted); }
    .hero-preview { position: relative; border-radius: 10px; overflow: hidden; margin-bottom: 16px; }
    .hero-preview img { width: 100%; height: 100px; object-fit: cover; display: block; }
    .hero-remove { position: absolute; top: 6px; right: 6px; background: rgba(0,0,0,.6); color: #FFF; border: none; border-radius: 6px; padding: 4px 8px; cursor: pointer; font-size: 11px; font-weight: 700; font-family: inherit; }

    .link-box { padding: 12px; background: var(--surface-warm); border: 1px solid var(--border); border-radius: 10px; margin-top: 12px; display: flex; align-items: center; gap: 8px; }
    .link-url { flex: 1; font-size: 12px; color: var(--text-sub); word-break: break-all; }
    .link-copy { padding: 8px 14px; background: var(--accent); color: #FFF; border: none; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; }

    /* ── BUTTON ── */
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 12px 20px; background: var(--accent); color: #FFF; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background 0.15s, transform 0.15s; }
    .btn:hover { background: var(--accent-hover); }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }
    .btn-secondary { background: var(--surface); color: var(--text); border: 1.5px solid var(--border); }
    .btn-secondary:hover { background: var(--surface-warm); }
    .btn-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }

    /* ── RSVP LIST ── */
    .rsvp-section { margin-top: 20px; }
    .rsvp-chip { display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 5px; background: var(--green-bg); border: 1px solid var(--green-border); border-radius: 20px; font-size: 12px; font-weight: 600; color: var(--green); margin: 0 6px 6px 0; }
    .rsvp-chip.declined { background: var(--red-bg); border-color: rgba(220,38,38,0.15); color: var(--red); text-decoration: line-through; opacity: 0.7; }
    .rsvp-avatar { width: 22px; height: 22px; border-radius: 11px; background: var(--green); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
    .rsvp-chip.declined .rsvp-avatar { background: var(--red); }
    .rsvp-total { font-size: 13px; color: var(--text-sub); margin-top: 8px; }

    /* ── PHOTOS GRID ── */
    .photos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-top: 12px; }
    .photos-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; }
    .photos-empty { font-size: 13px; color: var(--text-muted); text-align: center; padding: 20px; }

    /* ── EXTRAS ── */
    .extra-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
    .extra-img { width: 100%; height: 220px; object-fit: cover; display: block; }
    .extra-body { padding: 14px 16px; }
    .extra-name { font-family: 'Playfair Display', Georgia, serif; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
    .extra-detail { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-bottom: 10px; }
    .extra-footer { display: flex; align-items: center; justify-content: space-between; }
    .extra-price { font-size: 18px; color: var(--accent); font-weight: 800; font-family: 'Playfair Display', Georgia, serif; }
    .extra-btn { padding: 10px 20px; background: var(--accent); color: #FFF; border: none; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; font-family: inherit; white-space: nowrap; transition: transform 0.15s; }
    .extra-btn:hover { transform: scale(1.03); }
    .extra-btn:active { transform: scale(0.97); }
    .extra-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .extra-btn.sent { background: var(--green-bg); color: var(--green); border: 1px solid var(--green-border); }
    .extra-no-img { height: 80px; background: linear-gradient(135deg, var(--surface-warm), var(--border-light)); display: flex; align-items: center; justify-content: center; font-size: 36px; }

    /* ── SCRATCH CARD (REGALO) ── */
    .regalo-wrap { margin-top: 20px; }
    .regalo-card {
      position: relative; border-radius: 16px; overflow: hidden;
      background: linear-gradient(135deg, #FFD700, #FFA500); box-shadow: 0 4px 20px rgba(255,165,0,0.3);
      padding: 0; width: 100%; aspect-ratio: 1.6;
    }
    .regalo-prize {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; padding: 20px; text-align: center;
    }
    .regalo-prize-emoji { font-size: 48px; margin-bottom: 8px; animation: regalo-bounce 0.6s ease; }
    .regalo-prize-text { font-family: 'Playfair Display', Georgia, serif; font-size: 22px; font-weight: 800; color: #1C1C1E; line-height: 1.3; }
    .regalo-prize-sub { font-size: 13px; color: #5C4033; margin-top: 8px; }
    .regalo-prize-timer { font-size: 12px; color: #C4602B; font-weight: 700; margin-top: 10px; }
    .regalo-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      cursor: pointer; touch-action: none; z-index: 2;
    }
    .regalo-hint {
      position: absolute; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; z-index: 3;
      pointer-events: none; transition: opacity 0.3s;
    }
    .regalo-hint-emoji { font-size: 44px; animation: regalo-wiggle 1.5s ease-in-out infinite; }
    .regalo-hint-text { font-family: 'Playfair Display', Georgia, serif; font-size: 18px; font-weight: 700; color: #FFF; text-shadow: 0 2px 8px rgba(0,0,0,0.3); margin-top: 6px; }
    .regalo-hint-sub { font-size: 13px; color: rgba(255,255,255,0.9); text-shadow: 0 1px 4px rgba(0,0,0,0.3); margin-top: 4px; }
    .regalo-cta { display: block; margin: 12px auto 0; padding: 12px 28px; background: var(--accent); color: #FFF; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; font-family: inherit; }
    .regalo-expired { text-align: center; padding: 16px; background: var(--surface-warm); border: 1px solid var(--border); border-radius: 12px; }
    @keyframes regalo-wiggle { 0%,100% { transform: rotate(-5deg); } 50% { transform: rotate(5deg); } }
    @keyframes regalo-bounce { 0% { transform: scale(0); } 50% { transform: scale(1.2); } 100% { transform: scale(1); } }

    /* ── TOAST ── */
    .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px); background: #1C1C1E; color: #FFF; padding: 12px 20px; border-radius: 12px; font-size: 13px; font-weight: 600; z-index: 999; transition: transform 0.3s ease; pointer-events: none; white-space: nowrap; }
    .toast.show { transform: translateX(-50%) translateY(0); }

    /* ── WELCOME ── */
    .welcome { background: linear-gradient(135deg, var(--accent), #9E4A1E); border-radius: var(--radius); padding: 20px; margin-bottom: 20px; color: #FFF; }
    .welcome-hi { font-size: 13px; opacity: 0.85; margin-bottom: 4px; }
    .welcome-title { font-family: 'Playfair Display', Georgia, serif; font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .welcome-sub { font-size: 13px; opacity: 0.85; line-height: 1.5; }

    /* ── TAB INTRO ── */
    .tab-intro { background: var(--surface-warm); border: 1px solid var(--border-light); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 16px; }
    .tab-intro-title { font-size: 14px; font-weight: 700; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
    .tab-intro-text { font-size: 13px; color: var(--text-sub); line-height: 1.5; }
    .tab-intro-steps { list-style: none; padding: 0; margin: 8px 0 0; }
    .tab-intro-steps li { font-size: 12px; color: var(--text-sub); padding: 4px 0; display: flex; align-items: flex-start; gap: 8px; line-height: 1.4; }
    .step-num { width: 20px; height: 20px; border-radius: 10px; background: var(--accent); color: #FFF; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex-shrink: 0; }

    .hidden { display: none !important; }

    /* ── TIPS PRE-EVENTO ── */
    .tips-panel{background:linear-gradient(135deg,var(--gold-bg),#FFF8E6);border:1.5px solid var(--gold-border);border-radius:16px;padding:20px;margin-bottom:20px}
    .tips-title{font-family:'Playfair Display',Georgia,serif;font-size:18px;font-weight:700;color:var(--text);margin-bottom:4px;display:flex;align-items:center;gap:8px}
    .tips-subtitle{font-size:12px;color:var(--text-muted);margin-bottom:16px}
    .tips-grid{display:flex;flex-direction:column;gap:10px}
    .tip-card{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--border);border-radius:12px}
    .tip-ico{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
    .tip-ico-pay{background:#FEF2F2}
    .tip-ico-rsvp{background:#EBF5ED}
    .tip-ico-clock{background:#EFF6FF}
    .tip-ico-weather{background:#FFF7ED}
    .tip-ico-tip{background:var(--gold-bg)}
    .tip-label{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text-muted);margin-bottom:2px}
    .tip-text{font-size:14px;color:var(--text);line-height:1.4;font-weight:600}
    .tip-sub{font-size:12px;color:var(--text-sub);line-height:1.4;margin-top:2px}
    .tip-list{list-style:none;padding:0;margin:6px 0 0;display:flex;flex-wrap:wrap;gap:6px}
    .tip-list li{font-size:12px;color:var(--text-sub);background:var(--surface-warm);border:1px solid var(--border-light);padding:4px 10px;border-radius:8px}

    /* ── NUDGES UPSELL ── */
    .nudge-panel{background:linear-gradient(135deg,#FFF8F5,#FFF3EC);border:1.5px solid rgba(196,96,43,0.15);border-radius:16px;padding:18px;margin-bottom:16px}
    .nudge-title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:3px}
    .nudge-sub{font-size:12px;color:var(--text-muted);margin-bottom:14px}
    .nudge-card{display:flex;align-items:center;gap:12px;padding:12px;background:var(--surface);border:1px solid var(--border);border-radius:12px;margin-bottom:8px;cursor:pointer;transition:border-color .15s}
    .nudge-card:last-child{margin-bottom:0}
    .nudge-img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex-shrink:0;background:var(--surface-warm)}
    .nudge-name{font-size:14px;font-weight:600;color:var(--text)}
    .nudge-hint{font-size:12px;color:var(--text-sub);line-height:1.3;margin-top:2px}
    .nudge-price{font-size:12px;font-weight:700;color:var(--accent);margin-top:3px}
    .nudge-arrow{color:var(--accent);font-size:18px;margin-left:auto;flex-shrink:0}
  </style>
</head>
<body>
<div id="app">
  <div class="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">Cargando tu evento...</div>
  </div>
</div>
<div class="toast" id="toast"></div>
<input type="file" accept="image/jpeg,image/png,image/webp" id="hero-file" style="display:none" />

<script>

      $("app").innerHTML = '<div class="error-page"><h2>Evento no encontrado</h2><p>Este link no es valido o el evento ya no esta disponible.</p></div>';
      return;
    }
    DATA = data;
    shareToken = data.reserva.share_token || "";
    sections = data.reserva.share_sections || {};
    message = data.reserva.share_message || "";
    theme = data.reserva.share_theme || "verde";
    heroUrl = data.reserva.share_hero_url || "";
    nombreEvento = data.reserva.nombre_evento || "";
    if (data.reserva.sobre_digital) {
      var sd = data.reserva.sobre_digital;
      sobreDigital = {activo:!!sd.activo,mensaje:sd.mensaje||"",alias:sd.alias||"",cbu:sd.cbu||"",mpLink:sd.mpLink||"",metaNombre:sd.metaNombre||"",metaMonto:sd.metaMonto||0,montoJuntado:sd.montoJuntado||0,mostrarProgreso:!!sd.mostrarProgreso,muralActivo:sd.muralActivo!==false};
      if (sd.activo) sections.sobre_digital = true;
    }
    document.title = (nombreEvento || "Mi Evento") + " — " + (data.negocio.nombre_negocio || "");

    // PWA: manifest dinámico para "Agregar a inicio"
    (function() {
      var tipo = (data.reserva.tipo_evento || "").toLowerCase();
      var emoji = "🎉";
      if (tipo.indexOf("cumple") >= 0 || tipo.indexOf("birthday") >= 0) emoji = "🎂";
      else if (tipo.indexOf("casamiento") >= 0 || tipo.indexOf("boda") >= 0) emoji = "💍";
      else if (tipo.indexOf("bautismo") >= 0) emoji = "👼";
      else if (tipo.indexOf("infantil") >= 0 || tipo.indexOf("nene") >= 0 || tipo.indexOf("nena") >= 0) emoji = "🎈";
      else if (tipo.indexOf("empresa") >= 0 || tipo.indexOf("corporate") >= 0 || tipo.indexOf("after") >= 0) emoji = "🏢";
      else if (tipo.indexOf("navidad") >= 0) emoji = "🎄";
      else if (tipo.indexOf("año nuevo") >= 0) emoji = "🥂";
      else if (tipo.indexOf("despedida") >= 0) emoji = "💃";
      else if (tipo.indexOf("egresado") >= 0 || tipo.indexOf("graduacion") >= 0) emoji = "🎓";
      else if (tipo.indexOf("reunion") >= 0 || tipo.indexOf("juntada") >= 0) emoji = "🍻";
      var appName = nombreEvento || "Mi Evento";
      var manifest = {
        name: emoji + " " + appName,
        short_name: appName.length > 20 ? appName.slice(0, 18) + "…" : appName,
        description: "Tu evento en " + (data.negocio.nombre_negocio || "nuestro espacio"),
        start_url: window.location.href,
        display: "standalone",
        background_color: "#F6F2EC",
        theme_color: "#C4602B",
        icons: [
          { src: "/icon-192.png", sizes: "192x192", type: "image/png" },
          { src: "/icon-512.png", sizes: "512x512", type: "image/png" }
        ]
      };
      var blob = new Blob([JSON.stringify(manifest)], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var link = document.createElement("link");
      link.rel = "manifest";
      link.href = url;
      document.head.appendChild(link);
      document.querySelector('meta[name="apple-mobile-web-app-title"]') ||
        (function() { var m = document.createElement("meta"); m.name = "apple-mobile-web-app-title"; m.content = emoji + " " + appName; document.head.appendChild(m); })();
    })();

    // PWA tracking
    window.addEventListener("appinstalled", function() {
      api("portal-track", { token: token, edit_mode: true, evento: "pwa_instalada" }, 0).catch(function(){});
    });
    if (window.matchMedia("(display-mode: standalone)").matches) {
      api("portal-track", { token: token, edit_mode: true, evento: "pwa_abierta" }, 0).catch(function(){});
    }

    // Fetch clima si faltan <=2 dias
    var evD = new Date(data.reserva.fecha + "T12:00:00");
    var nowD = new Date(); nowD.setHours(0,0,0,0);
    var daysL = Math.ceil((evD.getTime() - nowD.getTime()) / 86400000);
    if (daysL >= 0 && daysL <= 2 && !weatherData) fetchWeather(data.reserva.fecha);
    renderApp();
    trackMi("vista_cliente");
  }).catch(function() {
    $("app").innerHTML = '<div class="error-page"><h2>Error de conexion</h2><p>No pudimos cargar los datos. Intenta de nuevo.</p></div>';
  });

  // ── RENDER APP ──
  function renderApp() {
    var d = DATA;
    var neg = d.negocio;
    var res = d.reserva;
    var cli = d.cliente;
    var clienteName = [cli.nombre, cli.apellido].filter(Boolean).join(" ") || "Organizador";

    var html = '';

    // Header
    html += '<div class="header"><div class="header-inner">';
    if (neg.logo_url) html += '<img class="header-logo" src="' + esc(neg.logo_url) + '" alt="" />';
    html += '<div class="header-info">';
    html += '<div class="header-biz">' + esc(neg.nombre_negocio || "") + '</div>';
    html += '<div class="header-event">' + esc(nombreEvento || "Mi Evento") + '</div>';
    html += '</div></div></div>';

    // Banner instalar PWA (solo mobile, solo si no está instalada)
    if (!window.matchMedia("(display-mode: standalone)").matches && /Mobi|Android|iPhone/i.test(navigator.userAgent) && !sessionStorage.getItem("pwa_dismissed")) {
      var isIos = /iPhone|iPad|iPod/i.test(navigator.userAgent);
      var instruccion = isIos
        ? 'Tocá <strong style="font-size:15px">⎙</strong> abajo y después <strong>"Agregar a inicio"</strong>'
        : 'Tocá <strong>⋮</strong> arriba y después <strong>"Agregar a inicio"</strong>';
      html += '<div id="pwa-banner" style="margin:12px 16px 0;padding:12px 14px;background:linear-gradient(135deg,#1C1C1E,#374151);border-radius:12px;display:flex;align-items:center;gap:10px;color:#FFF;position:relative">';
      html += '<span style="font-size:28px;flex-shrink:0">📲</span>';
      html += '<div style="flex:1"><div style="font-size:13px;font-weight:700;margin-bottom:2px">Guardalo en tu celu</div>';
      html += '<div style="font-size:11px;color:rgba(255,255,255,0.7);line-height:1.4">' + instruccion + '</div></div>';
      html += '<button onclick="sessionStorage.setItem(\'pwa_dismissed\',\'1\');this.parentElement.remove()" style="position:absolute;top:6px;right:8px;background:none;border:none;color:rgba(255,255,255,0.5);font-size:16px;cursor:pointer;padding:4px">✕</button>';
      html += '</div>';
    }

    // Tabs
    var rsvpCount = (d.rsvp || []).filter(function(r) { return r.estado === "confirmado"; }).reduce(function(s, r) { return s + r.cantidad; }, 0);
    var rsvpBadge = rsvpCount > 0 ? '<span style="background:var(--green);color:#FFF;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px">' + rsvpCount + '</span>' : '';
    html += '<div class="tabs"><div class="tabs-inner">';
    html += '<button class="tab' + (activeTab === "reserva" ? " active" : "") + '" data-tab="reserva"><span class="tab-ico">📋</span>Mi Reserva' + rsvpBadge + '</button>';
    html += '<button class="tab' + (activeTab === "evento" ? " active" : "") + '" data-tab="evento"><span class="tab-ico">🔗</span>Mi Evento</button>';
    var hasRegalo = d.reserva.regalo_descuento && d.reserva.regalo_enviado_en && (Date.now() < new Date(d.reserva.regalo_enviado_en).getTime() + 72*60*60*1000);
    var regaloBadge = hasRegalo ? '<span style="background:#FFD700;color:#1C1C1E;font-size:10px;font-weight:700;padding:1px 6px;border-radius:10px;margin-left:4px">🎁</span>' : '';
    html += '<button class="tab' + (activeTab === "extras" ? " active" : "") + '" data-tab="extras"><span class="tab-ico">✨</span>Extras' + regaloBadge + '</button>';
    html += '</div></div>';

    // Content
    html += '<div class="content">';

    // Welcome (first visit feel)
    html += '<div class="welcome">';
    html += '<div class="welcome-hi">Hola ' + esc(clienteName.split(" ")[0]) + ' 👋</div>';
    html += '<div class="welcome-title">Este es el portal de tu evento</div>';
    html += '<div class="welcome-sub">Desde aca podes ver los datos de tu reserva, armar la invitacion para tus invitados y solicitar extras.</div>';
    html += '</div>';

    // Tips pre-evento (48hs antes)
    html += renderTipsPanel(d);

    // Mercado del evento (solo si está activo y el evento es hoy o ya empezó)
    if (d.reserva.mercado_activo && d.mercado && d.mercado.length > 0) {
      var evStartMs = new Date(d.reserva.fecha + "T" + (d.reserva.horario || "00:00") + ":00").getTime();
      var evEndMs = new Date(d.reserva.fecha + "T" + (d.reserva.horario_fin || "23:59") + ":00").getTime();
      var nowMerc = Date.now();
      if (nowMerc >= evStartMs - 3600000 && nowMerc <= evEndMs + 3600000) {
        html += '<div style="margin:0 16px 16px;padding:16px;background:var(--surface);border-radius:var(--radius);border:2px solid var(--green-border);box-shadow:var(--shadow-sm)">';
        html += '<div style="display:flex;align-items:center;gap:8px;margin-bottom:12px">';
        html += '<span style="font-size:22px">🛒</span>';
        html += '<div><div style="font-weight:700;font-size:15px;color:var(--text)">Mercado del evento</div>';
        html += '<div style="font-size:12px;color:var(--text-sub)">Pedí lo que necesites directo desde acá</div></div>';
        html += '</div>';
        html += '<div style="display:flex;flex-direction:column;gap:8px" id="mercado-items">';
        for (var mi = 0; mi < d.mercado.length; mi++) {
          var prod = d.mercado[mi];
          html += '<div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--surface-warm);border-radius:10px;border:1px solid var(--border)">';
          html += '<span style="font-size:24px">' + esc(prod.emoji || "📦") + '</span>';
          html += '<div style="flex:1;min-width:0">';
          html += '<div style="font-weight:600;font-size:14px;color:var(--text)">' + esc(prod.nombre) + '</div>';
          html += '<div style="font-size:13px;color:var(--text-sub)">$' + Number(prod.precio).toLocaleString("es-AR") + '</div>';
          html += '</div>';
          html += '<button onclick="_pedirProducto(\'' + esc(prod.id) + '\')" style="padding:6px 14px;background:var(--accent);color:#FFF;border:none;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap">Pedir</button>';
          html += '</div>';
        }
        html += '</div>';
        html += '<div id="mercado-msg" style="display:none;margin-top:10px;padding:10px;background:var(--green-bg);border-radius:8px;border:1px solid var(--green-border);font-size:13px;color:var(--green);font-weight:600;text-align:center"></div>';
        html += '</div>';
      }
    }

    if (activeTab === "reserva") html += renderReservaTab(d);
    if (activeTab === "evento") html += renderEventoTab(d);
    if (activeTab === "extras") html += renderExtrasTab(d);

    html += '</div>';

    $("app").innerHTML = html;
    bindEvents();
  }

  // ════════════════════════════════════════════
  // TAB 1: MI RESERVA
  // ════════════════════════════════════════════
  function renderReservaTab(d) {
    var res = d.reserva;
    var neg = d.negocio;
    var evDate = new Date(res.fecha + "T12:00:00");
    var dayName = DAYS[evDate.getDay()];
    var dayNum = evDate.getDate();
    var monthName = MONTHS[evDate.getMonth()];
    var year = evDate.getFullYear();

    var html = '';

    // Intro
    html += '<div class="tab-intro">';
    html += '<div class="tab-intro-title">📋 Datos de tu reserva</div>';
    html += '<div class="tab-intro-text">Aca tenes toda la info de tu evento: fecha, horario, estado de los pagos y las condiciones del lugar. Cualquier duda, contactanos por WhatsApp.</div>';
    html += '</div>';

    // Event info card
    html += '<div class="card">';
    html += '<div class="card-title">📅 Tu reserva</div>';
    html += '<div class="card-row"><span class="card-row-label">Fecha</span><span class="card-row-value">' + dayName + ' ' + dayNum + ' de ' + monthName + ' ' + year + '</span></div>';
    html += '<div class="card-row"><span class="card-row-label">Horario</span><span class="card-row-value">' + esc(res.horario || "") + ' a ' + esc(res.horario_fin || "") + '</span></div>';
    if (res.turno && res.turno.length < 20) html += '<div class="card-row"><span class="card-row-label">Turno</span><span class="card-row-value">' + esc(res.turno) + '</span></div>';
    html += '<div class="card-row"><span class="card-row-label">Invitados</span><span class="card-row-value">' + (res.cant_invitados || 0) + ' personas</span></div>';
    if (res.tipo_evento) html += '<div class="card-row"><span class="card-row-label">Tipo</span><span class="card-row-value">' + esc(res.tipo_evento) + '</span></div>';
    html += '<div class="card-row"><span class="card-row-label">Estado</span><span class="card-row-value">' + esc(res.estado || "") + '</span></div>';
    html += '</div>';

    // Payment card
    var pay = d.pagos;
    if (pay.total > 0) {
      var pct = pay.total > 0 ? Math.min(100, Math.round(pay.pagado / pay.total * 100)) : 0;
      html += '<div class="card">';
      html += '<div class="card-title">💰 Estado de pago</div>';
      html += '<div class="pay-summary">';
      html += '<div class="pay-box"><div class="pay-box-label">Total</div><div class="pay-box-value">' + fmtCurrency(pay.total) + '</div></div>';
      html += '<div class="pay-box"><div class="pay-box-label">Pagado</div><div class="pay-box-value pagado">' + fmtCurrency(pay.pagado) + '</div></div>';
      html += '<div class="pay-box"><div class="pay-box-label">Saldo</div><div class="pay-box-value' + (pay.saldo > 0 ? ' saldo' : '') + '">' + fmtCurrency(pay.saldo) + '</div></div>';
      html += '</div>';
      html += '<div class="pay-bar"><div class="pay-bar-fill" style="width:' + pct + '%"></div></div>';
      html += '<div style="text-align:center;font-size:11px;color:var(--text-muted)">' + pct + '% abonado</div>';

      if (pay.detalle && pay.detalle.length) {
        html += '<div class="pay-detail">';
        pay.detalle.forEach(function(p) {
          html += '<div class="pay-item"><span>' + fmtDate(p.fecha) + ' · ' + esc(p.metodo) + '</span><span class="pay-item-badge">' + fmtCurrency(p.monto) + '</span></div>';
        });
        html += '</div>';
      }
      html += '</div>';
    }

    // Extras contratados (si hay)
    if (d.extras && d.extras.length) {
      html += '<div class="card">';
      html += '<div class="card-title">🎉 Extras contratados</div>';
      d.extras.forEach(function(e) {
        html += '<div class="card-row"><span class="card-row-label">' + esc(e.descripcion) + (e.cantidad > 1 ? ' x' + e.cantidad : '') + '</span><span class="card-row-value">' + fmtCurrency(e.precio * e.cantidad) + '</span></div>';
      });
      html += '</div>';
    }

    // Nudges upsell (3-15 dias antes)
    html += renderNudges(d);

    // Regalo banner en Mi Reserva
    var hasRegalo = d.reserva.regalo_descuento && d.reserva.regalo_enviado_en && (Date.now() < new Date(d.reserva.regalo_enviado_en).getTime() + 72*60*60*1000);
    if (hasRegalo && !localStorage.getItem("regalo_" + DATA.id)) {
      html += '<div class="card" data-go-extras style="cursor:pointer;background:linear-gradient(135deg,#FFF8E6,#FFF3D0);border:1.5px solid #FFD54F;text-align:center;padding:20px 16px">';
      html += '<div style="font-size:36px;margin-bottom:6px">🎁</div>';
      html += '<div style="font-size:16px;font-weight:800;color:#1C1C1E;font-family:\'Playfair Display\',Georgia,serif">¡Tenés un regalito esperándote!</div>';
      html += '<div style="font-size:13px;color:#5C4033;margin-top:6px;line-height:1.5">Revisá los extras disponibles para descubrir tu sorpresa</div>';
      html += '<div style="margin-top:12px;display:inline-block;padding:10px 24px;background:#C4602B;color:#FFF;border-radius:10px;font-size:13px;font-weight:700">Ver mi regalito →</div>';
      html += '</div>';
    } else if (hasRegalo && localStorage.getItem("regalo_" + DATA.id) === "1") {
      var regaloText = DATA.reserva.regalo_descuento;
      var envMs = new Date(DATA.reserva.regalo_enviado_en).getTime() + 72*60*60*1000;
      var hLeft = Math.max(0, Math.ceil((envMs - Date.now()) / (1000*60*60)));
      html += '<div class="card" data-go-extras style="cursor:pointer;background:linear-gradient(135deg,#FFF8E6,#FFF3D0);border:1.5px solid #FFD54F;padding:14px 16px">';
      html += '<div style="display:flex;align-items:center;gap:12px">';
      html += '<span style="font-size:28px">🎉</span>';
      html += '<div style="flex:1"><div style="font-size:14px;font-weight:700;color:#1C1C1E">' + esc(regaloText) + '</div>';
      html += '<div style="font-size:12px;color:#C4602B;font-weight:600;margin-top:2px">⏳ Válido por ' + hLeft + 'h · Ver extras →</div></div>';
      html += '</div></div>';
    }

    // Conditions
    html += '<div class="conditions">';
    html += '<div class="conditions-title">📜 Condiciones del lugar</div>';
    if (neg.condiciones_email) {
      html += '<div class="conditions-text">' + esc(neg.condiciones_email) + '</div>';
    } else {
      RULES.forEach(function(r) {
        html += '<div class="rule-row"><span>' + r.icon + '</span><span>' + esc(r.text) + '</span></div>';
      });
    }
    html += '</div>';

    // Location
    if (neg.direccion) {
      html += '<a class="card" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(neg.direccion) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit">';
      html += '<span style="font-size:24px">📍</span>';
      html += '<div><div style="font-size:14px;font-weight:600">Como llegar</div><div style="font-size:12px;color:var(--text-sub)">' + esc(neg.direccion) + '</div></div>';
      html += '</a>';
    }

    // WhatsApp
    if (neg.telefono) {
      html += '<a class="card" href="https://wa.me/' + esc(neg.telefono) + '" target="_blank" rel="noopener" style="display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit">';
      html += '<span style="font-size:24px">💬</span>';
      html += '<div><div style="font-size:14px;font-weight:600">Contactar al lugar</div><div style="font-size:12px;color:var(--text-sub)">Abrir WhatsApp</div></div>';
      html += '</a>';
    }

    // RSVP resumen en Mi Reserva
    html += renderRsvpSection(d);

    return html;
  }

  // ════════════════════════════════════════════
  // RSVP SECTION (reutilizable)
  // ════════════════════════════════════════════
  function renderRsvpSection(d) {
    var html = '';
    var rsvpList = d.rsvp || [];
    var confirmed = rsvpList.filter(function(r) { return r.estado === "confirmado"; });
    var declined = rsvpList.filter(function(r) { return r.estado === "declinado"; });
    var totalConf = confirmed.reduce(function(s, r) { return s + r.cantidad; }, 0);
    var maxInv = d.reserva.cant_invitados || 0;

    html += '<div class="card" style="margin-top:16px">';
    html += '<div class="card-title">✅ Confirmaciones de asistencia (' + totalConf + (maxInv ? '/' + maxInv : '') + ')</div>';

    if (rsvpList.length === 0) {
      html += '<div style="text-align:center;padding:16px 0">';
      html += '<div style="font-size:28px;margin-bottom:6px">📋</div>';
      html += '<div style="font-size:13px;color:var(--text-muted);line-height:1.5">Todavia nadie confirmo asistencia.<br>Cuando compartas el link, tus invitados van a poder confirmar desde ahi.</div>';
      html += '</div>';
    } else {
      html += '<div style="margin-bottom:8px">';
      rsvpList.forEach(function(g) {
        var cls = g.estado === "declinado" ? " declined" : "";
        html += '<span class="rsvp-chip' + cls + '"><span class="rsvp-avatar">' + esc(g.nombre.charAt(0).toUpperCase()) + '</span>' + esc(g.nombre) + ' · ' + g.cantidad + '</span>';
      });
      html += '</div>';
      html += '<div class="rsvp-total"><strong>' + totalConf + '</strong> persona' + (totalConf !== 1 ? 's' : '') + ' confirmada' + (totalConf !== 1 ? 's' : '') + (declined.length ? ' · ' + declined.length + ' no puede' + (declined.length !== 1 ? 'n' : '') : '') + '</div>';
    }

    html += '</div>';
    return html;
  }

  // ════════════════════════════════════════════
  // REGALO / RASPADITA
  // ════════════════════════════════════════════
  function renderRegaloSection(d) {
    var regalo = d.reserva.regalo_descuento;
    var enviadoEn = d.reserva.regalo_enviado_en;
    if (!regalo || !enviadoEn) return '';

    var expiraMs = new Date(enviadoEn).getTime() + 72 * 60 * 60 * 1000;
    var now = Date.now();
    if (now > expiraMs) {
      return '<div class="regalo-expired"><div style="font-size:28px;margin-bottom:6px">⏰</div><div style="font-size:14px;color:var(--text-sub)">Tu regalito expiró</div></div>';
    }

    var scratched = localStorage.getItem("regalo_" + DATA.id) === "1";
    var horasLeft = Math.max(0, Math.ceil((expiraMs - now) / (1000 * 60 * 60)));
    var html = '<div class="regalo-wrap">';

    if (scratched) {
      html += '<div class="regalo-card" style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center">';
      html += '<div class="regalo-prize-emoji">🎉</div>';
      html += '<div class="regalo-prize-text">' + esc(regalo) + '</div>';
      html += '<div class="regalo-prize-timer">⏳ Válido por ' + horasLeft + ' hora' + (horasLeft !== 1 ? 's' : '') + ' más</div>';
      html += '</div>';
      if (regalo.toLowerCase().indexOf("extra") !== -1) {
        html += '<button class="regalo-cta" data-go-extras>✨ Ver extras disponibles</button>';
      }
    } else {
      html += '<div class="regalo-card" id="regalo-card">';
      html += '<div class="regalo-prize">';
      html += '<div class="regalo-prize-emoji" style="animation:none">🎉</div>';
      html += '<div class="regalo-prize-text">' + esc(regalo) + '</div>';
      html += '<div class="regalo-prize-sub">¡Es todo tuyo!</div>';
      html += '<div class="regalo-prize-timer">⏳ Válido por ' + horasLeft + 'h</div>';
      html += '</div>';

      html += '<div class="regalo-hint-sub">Raspá para descubrirlo 👆</div>';
      html += '</div>';
      html += '</div>';
    }

    html += '</div>';
    return html;
  }

  // ════════════════════════════════════════════
  // TAB 2: MI EVENTO
  // ════════════════════════════════════════════
  function renderEventoTab(d) {

    html += '<div class="char-count"><span id="msg-count">' + message.length + '</span>/300</div>';
    html += '</div>';

    // Theme
    html += '<div class="card">';
    html += '<div class="card-title">🎨 Color del encabezado</div>';

      html += '<button class="theme-btn' + (theme === t.id ? " active" : "") + '" data-theme="' + t.id + '">';
      html += '<div class="theme-swatch" style="background:' + t.preview + '">';
      if (theme === t.id) html += '<span class="theme-check">✓</span>';
      html += '</div>';
      html += '<span class="theme-name">' + t.label + '</span>';
      html += '</button>';
    });
    html += '</div>';
    html += '</div>';

    // Hero image
    html += '<div class="card">';
    html += '<div class="card-title">🖼️ Imagen de fondo</div>';
    html += '<div style="font-size:12px;color:var(--text-sub);margin-bottom:10px">Subi una imagen tematica para el encabezado de la invitacion.</div>';
    if (heroUrl) {
      html += '<div class="hero-preview"><img src="' + esc(heroUrl) + '" alt="" /><button class="hero-remove" id="hero-remove">✕ Quitar</button></div>';
    } else {
      html += '<div class="hero-upload" id="hero-upload-btn"><span class="hero-upload-ico">' + (heroUploading ? "⏳" : "🖼️") + '</span><div><div class="hero-upload-text">' + (heroUploading ? "Subiendo..." : "Subir imagen") + '</div><div class="hero-upload-sub">JPG, PNG o WEBP · Max 3MB</div></div></div>';
    }
    html += '</div>';

    // ── SOBRE DIGITAL (appears when toggle is on) ──
    if (sections.sobre_digital) {
      html += '<div class="card">';
      html += '<div class="card-title">💝 Configurar sobre digital</div>';
      html += '<div style="font-size:12px;color:var(--text-sub);margin-bottom:12px;line-height:1.5">Tus invitados van a ver un sobre en la pagina del evento donde pueden colaborar con vos.</div>';

      html += '<div style="margin-bottom:10px"><div class="section-label">Mensaje para tus invitados</div>';
      html += '<textarea class="input textarea" id="inp-sobre-msg" maxlength="300" placeholder="Ej: Gracias por venir! Con tu presencia nos basta, pero si queres colaborar...">' + esc(sobreDigital.mensaje) + '</textarea></div>';

      html += '<div style="margin-bottom:10px"><div class="section-label">Alias bancario *</div>';
      html += '<input class="input" type="text" id="inp-sobre-alias" value="' + esc(sobreDigital.alias) + '" placeholder="Ej: sofi.cumple.2025" maxlength="50" /></div>';

      html += '<div style="margin-bottom:10px"><div class="section-label">Link de MercadoPago <span style="color:var(--text-muted);font-weight:400">(opcional)</span></div>';
      html += '<input class="input" type="url" id="inp-sobre-mp" value="' + esc(sobreDigital.mpLink) + '" placeholder="https://mpago.la/..." /></div>';

      html += '<div style="margin-bottom:10px"><div class="section-label">CBU <span style="color:var(--text-muted);font-weight:400">(opcional)</span></div>';
      html += '<input class="input" type="text" id="inp-sobre-cbu" value="' + esc(sobreDigital.cbu) + '" placeholder="0000003100..." maxlength="22" /></div>';

      html += '<label class="toggle-row"><input type="checkbox" id="chk-sobre-progreso" ' + (sobreDigital.mostrarProgreso ? "checked" : "") + ' /><span class="toggle-ico">📊</span><span class="toggle-label">Mostrar barra de progreso</span></label>';

      html += '<div id="sobre-progress-fields" style="' + (sobreDigital.mostrarProgreso ? "" : "display:none;") + 'margin-top:8px">';
      html += '<div style="display:flex;gap:8px">';
      html += '<div style="flex:1"><div class="section-label">Nombre de la meta</div><input class="input" type="text" id="inp-sobre-meta" value="' + esc(sobreDigital.metaNombre) + '" placeholder="Ej: Luna de miel" maxlength="50" /></div>';
      html += '<div style="width:110px"><div class="section-label">Meta $</div><input class="input" type="number" id="inp-sobre-meta-monto" value="' + (sobreDigital.metaMonto || "") + '" placeholder="300000" /></div>';
      html += '<div style="width:110px"><div class="section-label">Juntado $</div><input class="input" type="number" id="inp-sobre-juntado" value="' + (sobreDigital.montoJuntado || "") + '" placeholder="0" /></div>';
      html += '</div></div>';

      html += '<label class="toggle-row" style="margin-top:8px"><input type="checkbox" id="chk-sobre-mural" ' + (sobreDigital.muralActivo ? "checked" : "") + ' /><span class="toggle-ico">💬</span><span class="toggle-label">Mural de mensajes</span></label>';
      html += '<div style="font-size:11px;color:var(--text-muted);margin-top:2px;margin-left:28px">Los invitados pueden dejarte un mensaje</div>';

      html += '</div>';

    // Save button
    html += '<div class="btn-row">';

    html += '</div>';

    // Generated link
    html += '<div class="card" style="margin-top:16px">';
    html += '<div class="card-title">🔗 Link para tus invitados</div>';
    html += '<div style="font-size:12px;color:var(--text-sub);margin-bottom:8px;line-height:1.5">Copia este link y mandalo por WhatsApp o redes a tus invitados. Ahi van a poder confirmar si van, ver la info del evento y subir fotos el dia del evento.</div>';
    html += '<div class="link-box"><span class="link-url">' + esc(shareUrl) + '</span><button class="link-copy" id="btn-copy">Copiar</button></div>';
    html += '<div style="display:flex;gap:8px;margin-top:10px">';
    html += '<a href="' + esc(shareUrl) + '" target="_blank" rel="noopener" style="flex:1;display:flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;background:var(--surface-warm);border:1.5px solid var(--border);border-radius:10px;font-size:13px;font-weight:600;color:var(--text);text-decoration:none;font-family:inherit">👁️ Vista previa</a>';
    html += '</div>';
    html += '</div>';

    // RSVP list (siempre visible)
    html += renderRsvpSection(d);

    // Photos
    if (d.fotos && d.fotos.length) {
      html += '<div class="card">';
      html += '<div class="card-title">📸 Fotos del evento (' + d.fotos.length + ')</div>';
      html += '<div class="photos-grid">';
      d.fotos.forEach(function(f) {
        html += '<img src="' + esc(f.url) + '" alt="" loading="lazy" />';
      });
      html += '</div></div>';
    }

    return html;
  }

  // ════════════════════════════════════════════
  // TAB 3: EXTRAS
  // ════════════════════════════════════════════
  function renderExtrasTab(d) {
    var html = '';

    // Regalo
    html += renderRegaloSection(d);

    // Intro
    html += '<div class="tab-intro">';
    html += '<div class="tab-intro-title">✨ Extras para tu evento</div>';
    html += '<div class="tab-intro-text">Podes agregar servicios adicionales para hacer tu evento todavia mejor. Al solicitar uno, nos llega el pedido y te confirmamos disponibilidad y precio por WhatsApp.</div>';
    html += '</div>';

    // Already contracted
    if (d.extras && d.extras.length) {
      html += '<div class="card">';
      html += '<div class="card-title">🎉 Extras contratados</div>';
      d.extras.forEach(function(e) {
        html += '<div class="card-row"><span class="card-row-label">' + esc(e.descripcion) + (e.cantidad > 1 ? ' x' + e.cantidad : '') + '</span><span class="card-row-value">' + fmtCurrency(e.precio * e.cantidad) + '</span></div>';
      });
      html += '</div>';
    }

    // Available extras
    if (d.servicios && d.servicios.length) {
      html += '<div class="section-label" style="margin-top:8px;margin-bottom:12px">Servicios disponibles</div>';
      d.servicios.forEach(function(s) {
        var alreadyContracted = d.extras.some(function(e) { return e.descripcion === s.descripcion; });
        var alreadyRequested = !!requestedExtras[s.id];

        html += '<div class="extra-card">';
        if (s.foto_url) {
          html += '<img class="extra-img" src="' + esc(s.foto_url) + '" alt="" loading="lazy" />';
        } else {
          html += '<div class="extra-no-img">✨</div>';
        }
        html += '<div class="extra-body">';
        html += '<div class="extra-name">' + esc(s.descripcion) + '</div>';
        if (s.detalle) {
          html += '<div class="extra-detail">' + esc(s.detalle) + '</div>';
        }
        html += '<div class="extra-footer">';
        html += '<div class="extra-price">' + fmtCurrency(s.precio) + '</div>';
        if (alreadyContracted) {
          html += '<button class="extra-btn sent" disabled>Contratado ✓</button>';
        } else if (alreadyRequested) {
          html += '<button class="extra-btn sent" disabled>Solicitado ✓</button>';
        } else {
          html += '<button class="extra-btn" data-extra-id="' + esc(s.id) + '">Solicitar</button>';

        html += '</div></div></div>';
      });

      html += '<div style="font-size:12px;color:var(--text-muted);margin-top:12px;line-height:1.5">Al solicitar un extra, le avisamos al lugar para que confirmen disponibilidad y precio. Te contactaran por WhatsApp.</div>';
    } else {
      html += '<div class="card" style="text-align:center;padding:32px 16px">';

      html += '<div style="font-size:14px;color:var(--text-sub)">No hay servicios extras disponibles para este evento.</div>';
      html += '</div>';
    }

    return html;
  }

  // ════════════════════════════════════════════
  // EVENT BINDINGS
  // ════════════════════════════════════════════
  function bindEvents() {
    // Tab switching
    var tabs = document.querySelectorAll(".tab");
    tabs.forEach(function(tab) {
      tab.addEventListener("click", function() {
        activeTab = tab.getAttribute("data-tab");
        renderApp();
      });
    });

    // Section toggles
    var checks = document.querySelectorAll("[data-section]");
    checks.forEach(function(cb) {
      cb.addEventListener("change", function() {
        var key = cb.getAttribute("data-section");
        sections[key] = cb.checked;
        if (key === "sobre_digital") {
          sobreDigital.activo = cb.checked;
          renderApp();
        }
      });
    });

    // Message
    var msgInp = $("inp-message");
    if (msgInp) {
      msgInp.addEventListener("input", function() {
        message = msgInp.value.slice(0, 300);
        var counter = $("msg-count");
        if (counter) counter.textContent = message.length;
      });
    }

    // Nombre
    var nombreInp = $("inp-nombre");
    if (nombreInp) {
      nombreInp.addEventListener("input", function() {
        nombreEvento = nombreInp.value.slice(0, 100);
      });
    }

    // Theme
    var themeBtns = document.querySelectorAll(".theme-btn");
    themeBtns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        theme = btn.getAttribute("data-theme");
        renderApp();
      });
    });

    // Hero upload
    var heroBtn = $("hero-upload-btn");
    var heroFile = $("hero-file");
    if (heroBtn && heroFile) {
      heroBtn.addEventListener("click", function() { heroFile.click(); });
    }
    if (heroFile) {
      heroFile.addEventListener("change", function() {
        var file = heroFile.files && heroFile.files[0];
        if (!file) return;
        heroFile.value = "";
        if (!["image/jpeg","image/png","image/webp"].includes(file.type)) { showToast("Solo JPG, PNG o WEBP"); return; }
        if (file.size > 3 * 1024 * 1024) { showToast("Max 3MB"); return; }
        heroUploading = true;
        renderApp();
        var img = new Image();
        var url = URL.createObjectURL(file);
        img.onload = function() {
          var w = img.width, h = img.height;
          if (w > 1920) { h = Math.round(h * 1920 / w); w = 1920; }
          var canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          canvas.toBlob(function(blob) {
            var fileName = "hero/" + DATA.id + "_" + Date.now() + ".jpg";
            fetch(SUPA_URL + "/storage/v1/object/evento-fotos/" + fileName, {
              method: "POST",
              headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "image/jpeg" },
              body: blob
            }).then(function(r) {
              if (!r.ok) throw new Error("upload failed");
              heroUrl = SUPA_URL + "/storage/v1/object/public/evento-fotos/" + fileName;
              heroUploading = false;
              showToast("Imagen subida");
              renderApp();
            }).catch(function() {
              heroUploading = false;
              showToast("Error al subir imagen");
              renderApp();
            });
          }, "image/jpeg", 0.85);
        };
        img.onerror = function() { heroUploading = false; showToast("Error al procesar imagen"); renderApp(); };
        img.src = url;
      });
    }

    // Hero remove
    var heroRemove = $("hero-remove");
    if (heroRemove) {
      heroRemove.addEventListener("click", function() {
        heroUrl = "";
        renderApp();
      });
    }

    // Sobre digital: progress toggle
    var chkProgreso = $("chk-sobre-progreso");
    if (chkProgreso) {
      chkProgreso.addEventListener("change", function() {
        sobreDigital.mostrarProgreso = chkProgreso.checked;
        var pf = $("sobre-progress-fields");
        if (pf) pf.style.display = chkProgreso.checked ? "" : "none";
      });
    }
    var chkMural = $("chk-sobre-mural");
    if (chkMural) {
      chkMural.addEventListener("change", function() {
        sobreDigital.muralActivo = chkMural.checked;
      });
    }

    // Save
    var btnSave = $("btn-save");
    if (btnSave) {
      btnSave.addEventListener("click", function() {
        if (saving) return;

        // Read sobre fields before saving
        if (sections.sobre_digital) {
          var sm = $("inp-sobre-msg");
          var sa = $("inp-sobre-alias");
          var smp = $("inp-sobre-mp");
          var scbu = $("inp-sobre-cbu");
          var smeta = $("inp-sobre-meta");
          var smetam = $("inp-sobre-meta-monto");
          var sjunt = $("inp-sobre-juntado");
          if (sm) sobreDigital.mensaje = sm.value;
          if (sa) sobreDigital.alias = sa.value.trim();
          if (smp) sobreDigital.mpLink = smp.value.trim();
          if (scbu) sobreDigital.cbu = scbu.value.trim();
          if (smeta) sobreDigital.metaNombre = smeta.value.trim();
          if (smetam) sobreDigital.metaMonto = Number(smetam.value) || 0;
          if (sjunt) sobreDigital.montoJuntado = Number(sjunt.value) || 0;
        }

        saving = true;
        renderApp();
        var payload = {
          token: token,
          edit_mode: true,
          share_sections: sections,
          share_message: message,
          share_theme: theme,
          share_hero_url: heroUrl,
          nombre_evento: nombreEvento,
          sobre_digital: sobreDigital
        };
        api("portal-save", payload).then(function(r) {
          saving = false;
          if (r.ok) {
            showToast("Cambios guardados");
            DATA.reserva.share_sections = sections;
            DATA.reserva.share_message = message;
            DATA.reserva.share_theme = theme;
            DATA.reserva.share_hero_url = heroUrl;
            DATA.reserva.nombre_evento = nombreEvento;
            DATA.reserva.sobre_digital = JSON.parse(JSON.stringify(sobreDigital));
          } else {
            showToast("Error al guardar");
          }
          renderApp();
        }).catch(function() {
          saving = false;
          showToast("Error de conexion");
          renderApp();
        });
      });
    }

    // Copy link
    var btnCopy = $("btn-copy");
    if (btnCopy) {
      btnCopy.addEventListener("click", function() {
        var shareUrl = shareToken ? (window.location.origin + "/evento/" + shareToken) : "";
        navigator.clipboard.writeText(shareUrl).then(function() {
          showToast("Link copiado!");
          btnCopy.textContent = "Copiado!";
          setTimeout(function() { btnCopy.textContent = "Copiar"; }, 2000);
        });
      });
    }

    // Extra request buttons
    var extraBtns = document.querySelectorAll("[data-extra-id]");
    extraBtns.forEach(function(btn) {
      btn.addEventListener("click", function() {
        var sid = btn.getAttribute("data-extra-id");
        btn.disabled = true;
        btn.textContent = "Enviando...";
        api("portal-request-extra", { token: token, edit_mode: true, servicio_id: sid }).then(function(r) {
          if (r.ok) {
            requestedExtras[sid] = true;
            localStorage.setItem("portal_extras_" + token, JSON.stringify(requestedExtras));
            showToast("Solicitud enviada!");
          } else {
            showToast("Error al solicitar");
          }
          renderApp();
        }).catch(function() {
          showToast("Error de conexion");
          renderApp();
        });
      });
    });

    // Regalo: go-to-extras buttons
    document.querySelectorAll("[data-go-extras]").forEach(function(btn) {
      btn.addEventListener("click", function() {
        activeTab = "extras";
        renderApp();
        window.scrollTo(0, 0);
      });
    });

    // Regalo: scratch card canvas
    var canvas = document.getElementById("regalo-canvas");
    if (canvas) {
      var card = document.getElementById("regalo-card");
      var hint = document.getElementById("regalo-hint");
      var ctx = canvas.getContext("2d");
      var rect = card.getBoundingClientRect();
      canvas.width = rect.width * 2;
      canvas.height = rect.height * 2;
      canvas.style.width = rect.width + "px";
      canvas.style.height = rect.height + "px";
      ctx.scale(2, 2);

      // Draw scratch surface
      var grd = ctx.createLinearGradient(0, 0, rect.width, rect.height);
      grd.addColorStop(0, "#C4602B");
      grd.addColorStop(0.3, "#D4783F");
      grd.addColorStop(0.5, "#C4602B");
      grd.addColorStop(0.7, "#B5511E");
      grd.addColorStop(1, "#A0450F");
      ctx.fillStyle = grd;
      ctx.fillRect(0, 0, rect.width, rect.height);

      // Sparkle dots
      for (var i = 0; i < 40; i++) {
        var sx = Math.random() * rect.width;
        var sy = Math.random() * rect.height;
        var sr = Math.random() * 2 + 0.5;
        ctx.beginPath();
        ctx.arc(sx, sy, sr, 0, Math.PI * 2);
        ctx.fillStyle = "rgba(255,255,255," + (Math.random() * 0.3 + 0.1) + ")";
        ctx.fill();
      }

      var scratching = false;
      var totalPixels = rect.width * rect.height;
      var scratchedPixels = 0;
      var revealed = false;

      function getPos(e) {
        var t = e.touches ? e.touches[0] : e;
        var r = canvas.getBoundingClientRect();
        return { x: t.clientX - r.left, y: t.clientY - r.top };
      }

      function scratch(pos) {
        if (revealed) return;
        ctx.globalCompositeOperation = "destination-out";
        ctx.beginPath();
        ctx.arc(pos.x, pos.y, 22, 0, Math.PI * 2);
        ctx.fill();
        scratchedPixels += Math.PI * 22 * 22;

        if (hint.style.opacity !== "0") {
          hint.style.opacity = "0";
        }

        if (scratchedPixels > totalPixels * 0.35 && !revealed) {
          revealed = true;
          localStorage.setItem("regalo_" + DATA.id, "1");
          canvas.style.transition = "opacity 0.5s";
          canvas.style.opacity = "0";
          setTimeout(function() { renderApp(); }, 600);
        }
      }

      canvas.addEventListener("mousedown", function(e) { scratching = true; scratch(getPos(e)); });
      canvas.addEventListener("mousemove", function(e) { if (scratching) scratch(getPos(e)); });
      canvas.addEventListener("mouseup", function() { scratching = false; });
      canvas.addEventListener("mouseleave", function() { scratching = false; });
      canvas.addEventListener("touchstart", function(e) { e.preventDefault(); scratching = true; scratch(getPos(e)); }, { passive: false });
      canvas.addEventListener("touchmove", function(e) { e.preventDefault(); if (scratching) scratch(getPos(e)); }, { passive: false });
      canvas.addEventListener("touchend", function() { scratching = false; });
    }
  }
})();
</script>
